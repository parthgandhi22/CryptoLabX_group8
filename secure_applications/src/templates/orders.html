<!DOCTYPE html>
<html>
<head>
    <title>Order History</title>
</head>
<body>

<h1>Order History</h1>

{% for order in orders %}
<div>
    <p>Product: {{ order.product }}</p>
    <p>Price: ₹{{ order.price }}</p>
    <p>Quantity: {{ order.quantity }}</p>
    <p>Total: ₹{{ order.total }}</p>
</div>
<hr>
{% endfor %}

<a href="/">Back to Products</a>

</body>
</html>
