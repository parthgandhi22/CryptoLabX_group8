<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
</head>
<body>

<h1>Shopping Cart</h1>

{% if cart %}

    {% for item in cart %}

        <div>
            <h2>{{ item.name }}</h2>
            <p>Price: ₹{{ item.price }}</p>

            <a href="/remove/{{ loop.index0 }}">
                Remove
            </a>
        </div>

        <hr>

    {% endfor %}

    <h2>Total: ₹{{ total }}</h2>

    <a href="/checkout">Proceed to Checkout</a>

{% else %}

    <p>Your cart is empty.</p>

{% endif %}

<br><br>

<a href="/">Continue Shopping</a>

</body>
</html>
